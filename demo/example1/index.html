<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gem Tower Demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d13; color: #e6e9f0; font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  canvas { width: min(92vw, 74vh); height: min(92vw, 74vh); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  button { background: #262d3e; color: #e6e9f0; border: 1px solid #2a3142; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.on { background: #1f3a7a; border-color: #2f56b0; }
  .muted { color: #8b93a7; font-size: 12px; margin: 0; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar" id="gems"></div>
  <div class="bar" id="qualities"></div>
  <div class="bar">
    <button id="range" class="on">Range</button>
    <button id="slow">Slow-mo</button>
  </div>
  <p class="muted">Demo: one code-drawn gem tower. Each quality adds more detail — from a cracked rough stone to a crowned Great gem.</p>
<script>
// ---------- setup ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600, H = 600; // logical size
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const px = canvas.getBoundingClientRect().width;
  canvas.width = Math.round(px * dpr);
  canvas.height = Math.round(px * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
addEventListener('resize', resize);
resize();

const GEMS = {
  Ruby:       { base: '#ff3b4e', light: '#ffb3bb', dark: '#7a0614', shot: '#ff6a5a', splash: true },
  Sapphire:   { base: '#3d7bff', light: '#b8d0ff', dark: '#0b2470', shot: '#7fb0ff', slow: true },
  Emerald:    { base: '#2fcf6a', light: '#b5ffd0', dark: '#06501f', shot: '#6dff9a' },
  Amethyst:   { base: '#b05cff', light: '#e6c8ff', dark: '#3d0a73', shot: '#d199ff' },
  Topaz:      { base: '#ffd23d', light: '#fff2b5', dark: '#7a5600', shot: '#fff07a' },
  Aquamarine: { base: '#3fe0e6', light: '#c4fbff', dark: '#06555a', shot: '#8ff8ff' },
  Diamond:    { base: '#dfe9ff', light: '#ffffff', dark: '#6f7f9e', shot: '#ffffff' },
  Opal:       { base: '#ffb38a', light: '#fff0e6', dark: '#8a4220', shot: '#ffc7a8' },
};
const QUALITIES = ['Chipped', 'Flawed', 'Normal', 'Flawless', 'Perfect', 'Great'];

/**
 * Visual recipe per quality. Every step adds something so the tower reads as "more powerful" at a glance.
 * facets: cut count · rough: outline jitter · cracks: crack lines · glow: aura strength · beam: light from pedestal
 * runes: pedestal rune ring · trim: pedestal edge · inlays: glowing stones in the base · shards: orbiting crystals
 * claws: gold setting · halo: rotating rings · rays: god rays · circle: ground magic circle · motes: rising particles
 * crown: golden crown on top · pulse: periodic shockwave
 */
const TIERS = [
  { size: 13, facets: 4,  rough: 0.38, cracks: 3, glow: 0.25, beam: 0,   runes: 0,   trim: null,     inlays: 0, shards: 0, claws: false, halo: 0, rays: 0,  circle: false, motes: 0,   crown: false, pulse: 0, sparkles: 0, shot: 7 },
  { size: 15, facets: 5,  rough: 0.18, cracks: 2, glow: 0.4,  beam: 0,   runes: 0.4, trim: null,     inlays: 0, shards: 0, claws: false, halo: 0, rays: 0,  circle: false, motes: 0,   crown: false, pulse: 0, sparkles: 2, shot: 8 },
  { size: 17, facets: 6,  rough: 0,    cracks: 0, glow: 0.6,  beam: 0.2, runes: 0.7, trim: null,     inlays: 0, shards: 0, claws: false, halo: 0, rays: 0,  circle: false, motes: 0,   crown: false, pulse: 0, sparkles: 4, shot: 9 },
  { size: 19, facets: 8,  rough: 0,    cracks: 0, glow: 0.8,  beam: 0.3, runes: 1,   trim: '#c9d3e6', inlays: 0, shards: 2, claws: false, halo: 0, rays: 0,  circle: false, motes: 0.6, crown: false, pulse: 0, sparkles: 6, shot: 10 },
  { size: 21, facets: 10, rough: 0,    cracks: 0, glow: 1.0,  beam: 0.4, runes: 1,   trim: '#ffcf4a', inlays: 4, shards: 3, claws: true,  halo: 1, rays: 6,  circle: false, motes: 1.2, crown: false, pulse: 0, sparkles: 8, shot: 12 },
  { size: 26, facets: 12, rough: 0,    cracks: 0, glow: 1.4,  beam: 0.6, runes: 1,   trim: '#ffd84a', inlays: 6, shards: 5, claws: true,  halo: 2, rays: 10, circle: true,  motes: 2.5, crown: true,  pulse: 2.2, sparkles: 12, shot: 15 },
];

let gemName = 'Ruby', quality = 4, showRange = true, slowMo = false;
let banner = null; // quality-change announcement
const tier = () => TIERS[quality];

function buttons(el, items, isOn, onPick) {
  for (const [label, value] of items) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { onPick(value); [...el.children].forEach(c => c.classList.toggle('on', c === b)); };
    if (isOn(value)) b.classList.add('on');
    el.appendChild(b);
  }
}
buttons(document.getElementById('gems'), Object.keys(GEMS).map(n => [n, n]), v => v === gemName, v => { gemName = v; celebrate(false); });
buttons(document.getElementById('qualities'), QUALITIES.map((n, i) => [n, i]), v => v === quality, v => { const up = v > quality; quality = v; celebrate(up); });
document.getElementById('range').onclick = (e) => { showRange = !showRange; e.target.classList.toggle('on', showRange); };
document.getElementById('slow').onclick = (e) => { slowMo = !slowMo; e.target.classList.toggle('on', slowMo); };

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 1 - Math.pow(1 - t, 3);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, Math.min(1, Math.max(0, t))));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// ---------- world ----------
const tower = { x: 300, y: 320, cooldown: 0, recoil: 0, flash: 0, aim: 0, pulseTimer: 0 };
const RANGE = 210;
const creeps = [], shots = [], particles = [], texts = [], rings = [];
let time = 0, spawnTimer = 0, moteTimer = 0;

const PATH = [];
for (let i = 0; i < 240; i++) {
  const a = (i / 240) * Math.PI * 2;
  const r = 235 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), 0.25);
  PATH.push({ x: 300 + Math.cos(a) * r, y: 300 + Math.sin(a) * r });
}
function pathPoint(d) {
  const i = ((Math.floor(d) % PATH.length) + PATH.length) % PATH.length;
  const j = (i + 1) % PATH.length, t = d - Math.floor(d);
  return { x: lerp(PATH[i].x, PATH[j].x, t), y: lerp(PATH[i].y, PATH[j].y, t) };
}

function spawnCreep() {
  creeps.push({ d: rand(0, 240), hp: 100, shownHp: 100, max: 100, speed: rand(16, 24), hue: rand(0, 360), hit: 0, slow: 0, seed: rand(0, 10), x: 0, y: 0, dead: false });
}
for (let i = 0; i < 5; i++) spawnCreep();

function towerTop() {
  return { x: tower.x, y: tower.y - 50 - tier().size * 0.4 + Math.sin(time * 2.2) * 4 };
}

/** Burst + banner when the quality (or gem) changes. */
function celebrate(up) {
  const gem = GEMS[gemName], top = towerTop(), t = tier();
  const n = up ? 30 + quality * 12 : 16;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(80, 160 + quality * 50);
    particles.push({ x: top.x, y: top.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1), max: 1, size: rand(2, 4.5), color: i % 4 ? gem.light : '#ffd84a', glow: true });
  }
  rings.push({ x: top.x, y: top.y, r: 70 + quality * 22, life: 0.6, max: 0.6, color: gem.light, width: 4 });
  if (up && quality >= 3) rings.push({ x: tower.x, y: tower.y + 14, r: 120 + quality * 25, life: 0.8, max: 0.8, color: '#ffd84a', width: 3, flat: true });
  tower.flash = 1;
  banner = { text: QUALITIES[quality].toUpperCase() + (quality === 5 ? '!!' : up ? '!' : ''), life: 1.4, max: 1.4, big: up && quality >= 4, color: t.trim || gem.light };
}

// ---------- simulation ----------
function update(dt) {
  time += dt;
  const gem = GEMS[gemName], t = tier();

  spawnTimer -= dt;
  if (creeps.length < 6 && spawnTimer <= 0) { spawnCreep(); spawnTimer = 1.2; }

  for (const c of creeps) {
    c.slow = Math.max(0, c.slow - dt);
    c.d += c.speed * (c.slow > 0 ? 0.5 : 1) * dt;
    const p = pathPoint(c.d);
    c.x = p.x; c.y = p.y;
    c.hit = Math.max(0, c.hit - dt * 5);
    c.shownHp = lerp(c.shownHp, c.hp, 1 - Math.exp(-dt * 10));
  }

  // rising motes (Flawless+)
  moteTimer -= dt * t.motes * 10;
  while (t.motes > 0 && moteTimer <= 0) {
    moteTimer += 1;
    const a = rand(0, Math.PI * 2), r = rand(10, 38);
    particles.push({ x: tower.x + Math.cos(a) * r, y: tower.y - 4 + Math.sin(a) * r * 0.38, vx: rand(-6, 6), vy: rand(-55, -25), life: rand(0.8, 1.6), max: 1.6, size: rand(1, 2.4), color: Math.random() < 0.25 ? '#ffd84a' : gem.light, glow: true, nodrag: true });
  }

  // Great: periodic power pulse
  if (t.pulse) {
    tower.pulseTimer -= dt;
    if (tower.pulseTimer <= 0) {
      tower.pulseTimer = t.pulse;
      rings.push({ x: tower.x, y: tower.y + 14, r: 150, life: 0.9, max: 0.9, color: gem.base, width: 3, flat: true });
    }
  }

  tower.recoil = Math.max(0, tower.recoil - dt * 4);
  tower.flash = Math.max(0, tower.flash - dt * 5);
  tower.cooldown -= dt;
  const inRange = creeps.filter(c => Math.hypot(c.x - tower.x, c.y - tower.y) <= RANGE);
  if (inRange.length) {
    const target = inRange.reduce((a, b) => (Math.hypot(a.x - tower.x, a.y - tower.y) < Math.hypot(b.x - tower.x, b.y - tower.y) ? a : b));
    const want = Math.atan2(target.y - tower.y, target.x - tower.x);
    tower.aim += Math.atan2(Math.sin(want - tower.aim), Math.cos(want - tower.aim)) * Math.min(1, dt * 10);
    if (tower.cooldown <= 0) {
      tower.cooldown = 0.8 - quality * 0.07;
      tower.recoil = 1;
      tower.flash = 0.8;
      const top = towerTop();
      shots.push({ x: top.x, y: top.y, target, speed: 480 + quality * 30, color: gem.shot, life: 0, phase: rand(0, 6) });
      for (let i = 0; i < 6 + quality * 3; i++) {
        const a = tower.aim + rand(-0.7, 0.7);
        particles.push({ x: top.x, y: top.y, vx: Math.cos(a) * rand(60, 160), vy: Math.sin(a) * rand(60, 160), life: rand(0.2, 0.4), max: 0.4, size: rand(1.5, 3), color: gem.light, glow: true });
      }
    }
  }

  for (const s of shots) {
    s.life += dt;
    const dx = s.target.x - s.x, dy = s.target.y - 8 - s.y, d = Math.hypot(dx, dy);
    particles.push({ x: s.x, y: s.y, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.35, max: 0.35, size: rand(2, 3) + quality * 0.4, color: s.color, glow: true });
    if (quality >= 4) {
      // twin spiral trail
      const nx = -dy / (d || 1), ny = dx / (d || 1);
      for (const side of [-1, 1]) {
        const off = Math.sin(s.life * 30 + s.phase) * 7 * side;
        particles.push({ x: s.x + nx * off, y: s.y + ny * off, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 1.8, color: side > 0 ? '#ffffff' : '#ffd84a', glow: true });
      }
    }
    if (d < s.speed * dt || s.target.dead) { hit(s); s.done = true; continue; }
    s.x += (dx / d) * s.speed * dt;
    s.y += (dy / d) * s.speed * dt;
  }
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].done) shots.splice(i, 1);

  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.nodrag) { p.vx *= 1 - dt * 3; p.vy *= 1 - dt * 3; }
    if (p.gravity) p.vy += p.gravity * dt;
  }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  for (const x of texts) { x.life -= dt; x.y -= 40 * dt; }
  for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  for (const r of rings) r.life -= dt;
  for (let i = rings.length - 1; i >= 0; i--) if (rings[i].life <= 0) rings.splice(i, 1);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  for (let i = creeps.length - 1; i >= 0; i--) if (creeps[i].dead) creeps.splice(i, 1);
}

function hit(s) {
  const gem = GEMS[gemName];
  const c = s.target;
  if (c.dead) return;
  const crit = Math.random() < 0.15 + quality * 0.04;
  const dmg = Math.round(rand(14, 20) * (1 + quality * 0.3) * (crit ? 3 : 1));
  damage(c, dmg, crit);
  if (gem.slow) c.slow = 2;
  const big = 1 + quality * 0.15;
  rings.push({ x: c.x, y: c.y - 8, r: (gem.splash ? 55 : 22) * big, life: 0.35, max: 0.35, color: gem.shot, width: 2 + quality * 0.5 });
  for (let i = 0; i < (gem.splash ? 14 : 6) + quality * 3; i++) {
    const a = rand(0, Math.PI * 2), v = rand(40, (gem.splash ? 220 : 120) * big);
    particles.push({ x: c.x, y: c.y - 8, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.5), max: 0.5, size: rand(1.5, 3.5), color: i % 3 ? gem.shot : '#ffffff', glow: true });
  }
  if (gem.splash) for (const o of creeps) if (o !== c && !o.dead && Math.hypot(o.x - c.x, o.y - c.y) < 55 * big) damage(o, Math.round(dmg * 0.5), false);
}

function damage(c, dmg, crit) {
  c.hp -= dmg;
  c.hit = 1;
  texts.push({ x: c.x + rand(-6, 6), y: c.y - 30, text: crit ? dmg + '!' : String(dmg), crit, life: crit ? 0.9 : 0.6, max: crit ? 0.9 : 0.6 });
  if (c.hp <= 0 && !c.dead) {
    c.dead = true;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2), v = rand(60, 200);
      particles.push({ x: c.x, y: c.y - 8, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, gravity: 260, life: rand(0.4, 0.8), max: 0.8, size: rand(2, 4), color: `hsl(${c.hue},80%,60%)`, glow: false });
    }
    rings.push({ x: c.x, y: c.y, r: 40, life: 0.4, max: 0.4, color: '#ffffff', width: 3 });
    texts.push({ x: c.x, y: c.y - 46, text: '+3', gold: true, life: 1, max: 1 });
  }
}

// ---------- drawing: scene ----------
function drawBackground() {
  ctx.fillStyle = '#121620';
  ctx.fillRect(0, 0, W, H);
  const T = 40;
  for (let y = 0; y < H; y += T) for (let x = 0; x < W; x += T) {
    ctx.fillStyle = ((x + y) / T) % 2 ? '#161b27' : '#141924';
    ctx.fillRect(x, y, T, T);
  }
  ctx.save();
  ctx.lineWidth = 34;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(120,200,255,0.06)';
  ctx.beginPath();
  PATH.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
  // the stronger the gem, the more it lights up the ground
  const gem = GEMS[gemName];
  const lit = ctx.createRadialGradient(tower.x, tower.y, 0, tower.x, tower.y, 120 + quality * 30);
  lit.addColorStop(0, hexA(gem.base, 0.04 + quality * 0.035));
  lit.addColorStop(1, hexA(gem.base, 0));
  ctx.fillStyle = lit;
  ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(300, 300, 150, 300, 300, 430);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawRange() {
  if (!showRange) return;
  const gem = GEMS[gemName];
  ctx.save();
  ctx.fillStyle = hexA(gem.base, 0.04);
  ctx.strokeStyle = hexA(gem.base, 0.3);
  ctx.setLineDash([6, 8]);
  ctx.lineDashOffset = -time * 20;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, RANGE, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ---------- drawing: tower ----------
function drawMagicCircle() {
  if (!tier().circle) return;
  const gem = GEMS[gemName];
  const { x, y } = tower;
  ctx.save();
  ctx.translate(x, y + 14);
  ctx.scale(1, 0.38);
  ctx.globalCompositeOperation = 'lighter';
  ctx.rotate(time * 0.35);
  const R = 92;
  ctx.strokeStyle = hexA('#ffd84a', 0.5);
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = hexA(gem.base, 0.55);
  ctx.beginPath(); ctx.arc(0, 0, R - 12, 0, Math.PI * 2); ctx.stroke();
  // hexagram
  ctx.strokeStyle = hexA(gem.light, 0.55);
  ctx.lineWidth = 2;
  for (const off of [0, Math.PI / 3]) {
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) {
      const a = off + (i * Math.PI * 2) / 3;
      ctx.lineTo(Math.cos(a) * (R - 12), Math.sin(a) * (R - 12));
    }
    ctx.stroke();
  }
  // rune ticks
  ctx.rotate(-time * 0.8);
  for (let i = 0; i < 24; i++) {
    const a = (i * Math.PI * 2) / 24;
    ctx.fillStyle = hexA(i % 2 ? '#ffd84a' : gem.light, 0.7);
    ctx.fillRect(Math.cos(a) * (R + 8) - 2, Math.sin(a) * (R + 8) - 2, 4, 4);
  }
  ctx.restore();
}

function drawPedestal() {
  const { x, y } = tower;
  const t = tier(), gem = GEMS[gemName];
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(x, y + 18, 46, 14, 0, 0, Math.PI * 2); ctx.fill();
  const oct = (cx, cy, r, sy) => {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = Math.PI / 8 + (i * Math.PI) / 4;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy);
    }
    ctx.closePath();
  };
  // side and top faces; higher quality = cleaner, lighter stone
  const stone = quality >= 3 ? ['#353b4b', '#5a6278', '#2f3442'] : ['#2b303d', '#454c5e', '#262a35'];
  const side = ctx.createLinearGradient(x - 40, 0, x + 40, 0);
  side.addColorStop(0, stone[0]); side.addColorStop(0.5, stone[1]); side.addColorStop(1, stone[2]);
  ctx.fillStyle = side;
  ctx.fillRect(x - 38, y - 4, 76, 18);
  oct(x, y + 14, 40, 0.38); ctx.fill();
  const top = ctx.createLinearGradient(0, y - 18, 0, y + 10);
  top.addColorStop(0, quality >= 3 ? '#6c7590' : '#5b6378'); top.addColorStop(1, '#3a4152');
  ctx.fillStyle = top;
  oct(x, y - 4, 40, 0.38); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // chipped base is cracked and broken
  if (quality <= 1) {
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x - 30, y - 6); ctx.lineTo(x - 18, y - 2); ctx.lineTo(x - 22, y + 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 24, y - 8); ctx.lineTo(x + 14, y); ctx.stroke();
  }
  // metal trim
  if (t.trim) {
    ctx.strokeStyle = t.trim;
    ctx.lineWidth = quality >= 4 ? 2.5 : 1.8;
    oct(x, y - 4, 40, 0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 38, y + 13); ctx.lineTo(x + 38, y + 13); ctx.stroke();
    if (quality >= 5) { oct(x, y - 4, 32, 0.38); ctx.stroke(); }
  }
  // inlaid glowing stones on the side
  for (let i = 0; i < t.inlays; i++) {
    const ix = x - 30 + (60 / Math.max(1, t.inlays - 1)) * i;
    const glow = 0.5 + 0.5 * Math.sin(time * 4 + i);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(gem.base, 0.35 * glow);
    ctx.beginPath(); ctx.arc(ix, y + 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = mix(gem.base, gem.light, glow * 0.6);
    ctx.beginPath(); ctx.moveTo(ix, y + 1); ctx.lineTo(ix + 3, y + 5); ctx.lineTo(ix, y + 9); ctx.lineTo(ix - 3, y + 5); ctx.closePath(); ctx.fill();
  }
  // rune ring on the top face
  if (t.runes) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hexA(gem.base, t.runes * (0.35 + 0.25 * Math.sin(time * 3)));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y - 4, 26, 9, 0, 0, Math.PI * 2); ctx.stroke();
    const dots = 4 + quality * 2;
    for (let i = 0; i < dots; i++) {
      const a = time * 0.8 + (i * Math.PI * 2) / dots;
      ctx.fillStyle = hexA(gem.light, 0.6 * t.runes);
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 26, y - 4 + Math.sin(a) * 9, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawRays(top) {
  const t = tier();
  if (!t.rays) return;
  const gem = GEMS[gemName];
  ctx.save();
  ctx.translate(top.x, top.y);
  ctx.globalCompositeOperation = 'lighter';
  const len = 70 + quality * 20;
  for (let i = 0; i < t.rays; i++) {
    const a = time * 0.3 + (i * Math.PI * 2) / t.rays;
    const flick = 0.6 + 0.4 * Math.sin(time * 2 + i * 1.7);
    const g = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
    g.addColorStop(0, hexA(i % 2 && quality === 5 ? '#ffd84a' : gem.light, 0.35 * flick));
    g.addColorStop(1, hexA(gem.base, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.09) * len, Math.sin(a - 0.09) * len);
    ctx.lineTo(Math.cos(a + 0.09) * len, Math.sin(a + 0.09) * len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/** Halo rings around the gem; `front` draws only the half that passes in front of it. */
function drawHalo(top, front) {
  const t = tier();
  if (!t.halo) return;
  const gem = GEMS[gemName];
  for (let k = 0; k < t.halo; k++) {
    const R = t.size * (1.9 + k * 0.45);
    const tilt = k ? -0.35 : 0.3;
    const spin = time * (k ? -1.4 : 1);
    ctx.save();
    ctx.translate(top.x, top.y);
    ctx.rotate(tilt);
    ctx.scale(1, 0.3);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hexA(k ? '#ffd84a' : gem.light, 0.7);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, R, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
    ctx.stroke();
    // runes riding the ring
    const marks = 8;
    for (let i = 0; i < marks; i++) {
      const a = spin + (i * Math.PI * 2) / marks;
      const inFront = Math.sin(a) > 0;
      if (inFront !== front) continue;
      ctx.fillStyle = hexA(k ? '#fff2b5' : gem.light, 0.9);
      ctx.beginPath(); ctx.arc(Math.cos(a) * R, Math.sin(a) * R, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

/** Orbiting crystal shards; back ones are drawn before the gem, front ones after. */
function drawShards(top, front) {
  const t = tier();
  if (!t.shards) return;
  const gem = GEMS[gemName];
  for (let i = 0; i < t.shards; i++) {
    const a = time * 1.6 + (i * Math.PI * 2) / t.shards;
    const depth = Math.sin(a);
    if ((depth > 0) !== front) continue;
    const R = t.size * 2.1;
    const sx = top.x + Math.cos(a) * R, sy = top.y + depth * R * 0.35 + Math.sin(time * 3 + i) * 4;
    const s = 4 + quality * 0.6 + depth * 1.5;
    if (quality >= 5) {
      // comet tail
      for (let k = 1; k <= 5; k++) {
        const b = a - k * 0.12;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = hexA(gem.light, 0.18 * (1 - k / 6));
        ctx.beginPath(); ctx.arc(top.x + Math.cos(b) * R, top.y + Math.sin(b) * R * 0.35, s * (1 - k / 7), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(time * 3 + i);
    ctx.fillStyle = mix(gem.base, gem.light, 0.4 + depth * 0.3);
    ctx.globalAlpha = 0.65 + depth * 0.35;
    ctx.beginPath(); ctx.moveTo(0, -s * 1.4); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s * 1.4); ctx.lineTo(-s * 0.7, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hexA('#ffffff', 0.6);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }
}

function drawGemBody(top) {
  const gem = GEMS[gemName], t = tier();
  const size = t.size;
  const squash = 1 - tower.recoil * 0.12, stretch = 1 + tower.recoil * 0.08;
  ctx.save();
  ctx.translate(top.x, top.y);
  ctx.scale(stretch, squash);
  const turn = time * (quality <= 1 ? 0.4 : 0.9);
  const n = t.facets;
  const crownY = -size * 0.55, culetY = size * 1.05, tableR = size * (quality <= 1 ? 0.35 : 0.55);
  // rough stones get a lumpy outline (fixed per facet so it doesn't wobble)
  const r = (i) => size * (1 - t.rough * hash(i + n * 7));
  const facets = [];
  for (let i = 0; i < n; i++) {
    const a0 = turn + (i * Math.PI * 2) / n, a1 = turn + ((i + 1) * Math.PI * 2) / n;
    facets.push({ a0, a1, r0: r(i), r1: r((i + 1) % n), depth: Math.sin((a0 + a1) / 2) });
  }
  facets.sort((p, q) => p.depth - q.depth);
  const dull = quality <= 1 ? 0.45 : 1;
  for (const f of facets) {
    if (f.depth < -0.2) continue;
    const x0 = Math.cos(f.a0) * f.r0, x1 = Math.cos(f.a1) * f.r1;
    const t0 = Math.cos(f.a0) * tableR, t1 = Math.cos(f.a1) * tableR;
    const shade = (0.35 + 0.65 * Math.max(0, Math.cos(f.a0 + Math.PI / n - Math.PI / 2 - 0.6))) * dull;
    ctx.fillStyle = mix(gem.dark, gem.base, shade);
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x1, 0); ctx.lineTo(0, culetY * (quality <= 1 ? 0.75 : 1)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = mix(gem.base, gem.light, shade * 0.8);
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x1, 0); ctx.lineTo(t1, crownY); ctx.lineTo(t0, crownY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hexA(gem.light, quality <= 1 ? 0.15 : 0.35);
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.fillStyle = hexA(gem.light, quality <= 1 ? 0.35 : 0.85);
  ctx.beginPath(); ctx.ellipse(0, crownY, tableR, tableR * 0.22, 0, 0, Math.PI * 2); ctx.fill();

  // cracks on low qualities
  ctx.strokeStyle = 'rgba(10,10,15,0.6)';
  ctx.lineWidth = 1.1;
  for (let k = 0; k < t.cracks; k++) {
    ctx.beginPath();
    let cx = (hash(k * 3 + 1) - 0.5) * size, cy = crownY + hash(k * 3 + 2) * size * 0.4;
    ctx.moveTo(cx, cy);
    for (let s = 0; s < 3; s++) {
      cx += (hash(k * 9 + s) - 0.5) * size * 0.6;
      cy += size * 0.3;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  // light sweep (Normal+)
  if (quality >= 2) {
    ctx.globalCompositeOperation = 'lighter';
    const sweep = ((time * 0.6) % 1.6) - 0.3;
    const sg = ctx.createLinearGradient(-size + sweep * size * 2, -size, -size * 0.4 + sweep * size * 2, size);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, `rgba(255,255,255,${0.2 + quality * 0.05})`);
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.lineTo(0, culetY); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.lineTo(tableR, crownY); ctx.lineTo(-tableR, crownY); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // gold claws holding the gem (Perfect+)
  if (t.claws) {
    const claws = quality >= 5 ? 6 : 4;
    for (let i = 0; i < claws; i++) {
      const a = turn * 0.5 + (i * Math.PI * 2) / claws;
      if (Math.sin(a) < -0.1) continue;
      const cx = Math.cos(a) * size;
      const g = ctx.createLinearGradient(cx - 3, 0, cx + 3, 0);
      g.addColorStop(0, '#8a6410'); g.addColorStop(0.5, '#fff0a8'); g.addColorStop(1, '#a87a12');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx * 0.55 - 2, culetY * 0.55);
      ctx.lineTo(cx * 1.04 - 2.5, -1);
      ctx.lineTo(cx * 0.98, crownY * 0.45);
      ctx.lineTo(cx * 1.04 + 2.5, -1);
      ctx.lineTo(cx * 0.55 + 2, culetY * 0.55);
      ctx.closePath();
      ctx.fill();
    }
  }

  // golden crown (Great)
  if (t.crown) {
    const cy = crownY - 4, cw = tableR * 1.25;
    const g = ctx.createLinearGradient(0, cy - 16, 0, cy + 2);
    g.addColorStop(0, '#fff6c2'); g.addColorStop(0.5, '#ffd84a'); g.addColorStop(1, '#9a6c0c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-cw, cy);
    const spikes = 5;
    for (let i = 0; i <= spikes * 2; i++) {
      const px = -cw + (i * cw * 2) / (spikes * 2);
      const py = i % 2 ? cy - 16 - (i === spikes ? 5 : 0) : cy - 6;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(cw, cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,0,0.6)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // jewels on the spike tips
    for (let i = 1; i <= spikes * 2; i += 2) {
      const px = -cw + (i * cw * 2) / (spikes * 2);
      const py = cy - 16 - (i === spikes ? 5 : 0);
      ctx.fillStyle = i === spikes ? gem.light : gem.base;
      ctx.beginPath(); ctx.arc(px, py, i === spikes ? 3 : 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawTower() {
  const gem = GEMS[gemName], t = tier();
  const top = towerTop();

  drawMagicCircle();
  drawPedestal();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // light beam from pedestal to gem
  if (t.beam) {
    const beam = ctx.createLinearGradient(0, tower.y - 6, 0, top.y - (quality >= 5 ? 120 : 0));
    beam.addColorStop(0, hexA(gem.base, t.beam));
    beam.addColorStop(1, hexA(gem.base, 0));
    ctx.fillStyle = beam;
    const w = 10 + quality * 2;
    ctx.beginPath();
    ctx.moveTo(tower.x - w, tower.y - 6);
    ctx.lineTo(tower.x + w, tower.y - 6);
    ctx.lineTo(top.x + w * 0.4, top.y - (quality >= 5 ? 120 : 0));
    ctx.lineTo(top.x - w * 0.4, top.y - (quality >= 5 ? 120 : 0));
    ctx.fill();
  }
  // aura glow
  const glowR = t.size * (1.6 + t.glow * 1.4 + 0.3 * Math.sin(time * 3) + tower.flash * 1.2);
  const g = ctx.createRadialGradient(top.x, top.y, 0, top.x, top.y, glowR);
  g.addColorStop(0, hexA(gem.base, 0.25 + t.glow * 0.3 + tower.flash * 0.3));
  g.addColorStop(1, hexA(gem.base, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(top.x, top.y, glowR, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  drawRays(top);
  drawHalo(top, false);
  drawShards(top, false);
  drawGemBody(top);
  drawShards(top, true);
  drawHalo(top, true);

  // sparkles
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < t.sparkles; i++) {
    const phase = (time * 0.7 + i * 0.37) % 1;
    const a = i * 2.4 + Math.floor(time * 0.7 + i * 0.37) * 1.7;
    const r = t.size * (0.6 + ((i * 53) % 10) / 8);
    star(top.x + Math.cos(a) * r, top.y + Math.sin(a) * r * 0.9, Math.sin(phase * Math.PI) * (2.5 + quality * 0.7), i % 3 || quality < 4 ? gem.light : '#ffd84a');
  }
  ctx.restore();

  // quality pips
  const pips = quality + 1;
  for (let i = 0; i < pips; i++) {
    const px = tower.x - ((pips - 1) * 9) / 2 + i * 9;
    ctx.fillStyle = quality === 5 ? '#ffd84a' : gem.light;
    if (quality === 5) star(px, tower.y + 30, 2.2, '#ffd84a');
    else { ctx.beginPath(); ctx.arc(px, tower.y + 30, 2.6, 0, Math.PI * 2); ctx.fill(); }
  }
}

function star(x, y, r, color) {
  if (r <= 0.3) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 2);
  ctx.quadraticCurveTo(x, y, x + r * 2, y);
  ctx.quadraticCurveTo(x, y, x, y + r * 2);
  ctx.quadraticCurveTo(x, y, x - r * 2, y);
  ctx.quadraticCurveTo(x, y, x, y - r * 2);
  ctx.fill();
}

// ---------- drawing: creeps & effects ----------
function drawCreep(c) {
  const bob = Math.abs(Math.sin(time * 9 + c.seed)) * 5;
  const x = c.x, y = c.y;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x, y + 4, 12 - bob * 0.4, 4, 0, 0, Math.PI * 2); ctx.fill();
  const sq = 1 + (bob / 5) * 0.12;
  ctx.save();
  ctx.translate(x, y - 8 - bob);
  ctx.scale(1 / sq, sq);
  const body = ctx.createRadialGradient(-4, -5, 2, 0, 0, 14);
  body.addColorStop(0, `hsl(${c.hue},80%,70%)`);
  body.addColorStop(1, `hsl(${c.hue},70%,38%)`);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  if (c.slow > 0) { ctx.strokeStyle = 'rgba(140,190,255,0.9)'; ctx.lineWidth = 2; ctx.stroke(); }
  const ahead = pathPoint(c.d + 3);
  const dir = Math.atan2(ahead.y - y, ahead.x - x);
  for (const s of [-1, 1]) {
    const ex = Math.cos(dir) * 4 + Math.cos(dir + Math.PI / 2) * 4 * s, ey = -3 + Math.sin(dir) * 3;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + Math.cos(dir) * 1.2, ey + Math.sin(dir) * 1.2, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  if (c.hit > 0) {
    ctx.globalAlpha = c.hit * 0.8;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 12.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  const w = 28, frac = Math.max(0, c.hp / c.max), shown = Math.max(0, c.shownHp / c.max);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2 - 1, y - 32, w + 2, 5);
  ctx.fillStyle = '#ffd0a0'; ctx.fillRect(x - w / 2, y - 31, w * shown, 3);
  ctx.fillStyle = frac > 0.35 ? '#4dff88' : '#ff5050'; ctx.fillRect(x - w / 2, y - 31, w * frac, 3);
}

function drawEffects() {
  const t = tier();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shots) {
    const R = t.shot;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, s.color); g.addColorStop(1, hexA(s.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, Math.PI * 2); ctx.fill();
    if (quality >= 5) star(s.x, s.y, 3 + Math.sin(s.life * 40) * 1, '#ffffff');
  }
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalCompositeOperation = p.glow ? 'lighter' : 'source-over';
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    const k = 1 - r.life / r.max;
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = 1 - k;
    ctx.lineWidth = (r.width || 3) * (1 - k) + 1;
    ctx.beginPath();
    if (r.flat) ctx.ellipse(r.x, r.y, r.r * ease(k), r.r * ease(k) * 0.38, 0, 0, Math.PI * 2);
    else ctx.arc(r.x, r.y, r.r * ease(k), 0, Math.PI * 2);
    ctx.stroke();
  }
  if (tower.flash > 0) {
    const top = towerTop();
    ctx.globalAlpha = tower.flash;
    star(top.x + Math.cos(tower.aim) * (t.size + 4), top.y + Math.sin(tower.aim) * (t.size + 4), (4 + quality) * tower.flash, '#ffffff');
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  for (const x of texts) {
    const k = 1 - x.life / x.max;
    const pop = x.crit ? 1 + Math.max(0, 0.6 - k * 3) : 1;
    ctx.globalAlpha = Math.min(1, (x.life / x.max) * 2);
    ctx.font = `800 ${Math.round((x.crit ? 20 : 14) * pop)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(x.text, x.x, x.y);
    ctx.fillStyle = x.gold ? '#ffd84a' : x.crit ? '#ffe066' : '#ffffff';
    ctx.fillText(x.text, x.x, x.y);
  }
  ctx.globalAlpha = 1;
}

function drawBanner() {
  if (!banner) return;
  const k = 1 - banner.life / banner.max;
  const scale = k < 0.15 ? ease(k / 0.15) * 1.25 : 1.25 - Math.min(0.25, (k - 0.15) * 1.5);
  ctx.save();
  ctx.globalAlpha = Math.min(1, banner.life * 2);
  ctx.translate(300, 130);
  ctx.scale(scale, scale);
  ctx.font = `900 ${banner.big ? 44 : 32}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.strokeText(banner.text, 0, 0);
  const g = ctx.createLinearGradient(0, -30, 0, 6);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, banner.color);
  ctx.fillStyle = g;
  ctx.fillText(banner.text, 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();
  drawRange();
  const behind = creeps.filter(c => c.y < tower.y), front = creeps.filter(c => c.y >= tower.y);
  behind.forEach(drawCreep);
  drawTower();
  front.forEach(drawCreep);
  drawEffects();
  drawBanner();
  ctx.fillStyle = 'rgba(230,233,240,0.85)';
  ctx.font = '600 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${QUALITIES[quality]} ${gemName}`, 16, 28);
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (slowMo) dt *= 0.25;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
