<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gem Tower Defense — a browser prototype inspired by [BK's] Gem TD for Warcraft III." />
    <title>Gem TD</title>
  </head>
  <body>
    <div id="app">
      <main class="board-wrap">
        <div class="board-stack">
          <canvas id="board"></canvas>
          <div id="touchbar" hidden>
            <div class="tb-group">
              <button data-t="zoom-out" aria-label="Zoom out">−</button>
              <button data-t="fit" aria-label="Show whole board">⤢</button>
              <button data-t="zoom-in" aria-label="Zoom in">+</button>
            </div>
            <div class="tb-group dpad">
              <button data-t="left" aria-label="Move cursor left">◀</button>
              <button data-t="up" aria-label="Move cursor up">▲</button>
              <button data-t="down" aria-label="Move cursor down">▼</button>
              <button data-t="right" aria-label="Move cursor right">▶</button>
            </div>
            <button data-t="place" class="primary place">Place</button>
            <span class="hint"></span>
          </div>
        </div>
      </main>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
